<!DOCTYPE html>
<html lang="ja" style="background-color: #090a10;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090a10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GOD of Persona">
  <title>GOD of Persona</title>
  <!-- 0秒後に確実に指定URLへ転送するタグ -->
  <meta http-equiv="refresh" content="0;url=https://google.com">
  <link id="dynamic-icon" rel="apple-touch-icon" href="">
  <link id="dynamic-favicon" rel="icon" href="">
  <script>
    (function() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(256, 256, 40, 256, 256, 360);
      grad.addColorStop(0, '#162238');
      grad.addColorStop(1, '#07080d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#00d2ff';
      ctx.lineWidth = 14;
      ctx.strokeRect(36, 36, 440, 440);
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 138px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('GOD', 256, 240);
      ctx.fillStyle = '#00d2ff';
      ctx.font = 'bold 34px sans-serif';
      ctx.fillText('OF PERSONA', 256, 340);
      const dataUrl = canvas.toDataURL('image/png');
      document.getElementById('dynamic-icon').href = dataUrl;
      document.getElementById('dynamic-favicon').href = dataUrl;
    })();
    window.location.href = "https://google.com";
  </script>
</head>
<body style="background-color: #090a10; color: #00d2ff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; gap: 20px;">
  <p>CONNECTING TO GOD OF PERSONA...</p>
  <!-- 自動転送されない場合でも押せば飛べるリンク -->
  <a href="https://google.com" style="color: #090a10; background-color: #00d2ff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold;">
    手動で起動する
  </a>
</body>
</html>
