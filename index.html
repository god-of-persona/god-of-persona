<!DOCTYPE html>
<html lang="ja" style="background-color: #090a10;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090a10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GOD of Persona">
  <title>GOD of Persona</title>
  <link id="dynamic-icon" rel="apple-touch-icon" href="">
  <link id="dynamic-favicon" rel="icon" href="">
  <script>
    (function() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(256, 256, 40, 256, 256, 360);
      grad.addColorStop(0, '#162238');
      grad.addColorStop(1, '#07080d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#00d2ff';
      ctx.lineWidth = 14;
      ctx.strokeRect(36, 36, 440, 440);
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 138px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('GOD', 256, 240);
      ctx.fillStyle = '#00d2ff';
      ctx.font = 'bold 34px sans-serif';
      ctx.fillText('OF PERSONA', 256, 340);
      const dataUrl = canvas.toDataURL('image/png');
      document.getElementById('dynamic-icon').href = dataUrl;
      document.getElementById('dynamic-favicon').href = dataUrl;
    })();
    window.location.replace("https://script.google.com/macros/s/AKfycbxdHGi_t2Ocz8ZMZSvYNCq6KwOxXs5QZezp4H5bXoUqCAzKJWgoel2xIs28UP6nd3_Ubg/exec");
  </script>
</head>
<body style="background-color: #090a10; color: #00d2ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif;">
  <p>CONNECTING TO GOD OF PERSONA...</p>
</body>
</html>
